<!doctype html>
<html lang="it" prefix="og: http://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!--
      Title, description, canonical, Open Graph e dati strutturati sono definiti
      pagina per pagina nei componenti (react-helmet-async) e inseriti qui
      in fase di build da scripts/prerender.mjs.
    -->
    <meta name="author" content="Cooperativa Sociale Emmanuel" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta property="og:site_name" content="Cooperativa Sociale Emmanuel" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:image" content="https://cooperativaemmanuel.it/images/Logo.png" />
    <meta property="og:image:alt" content="Logo Cooperativa Sociale Emmanuel - Assistenza Domiciliare Napoli" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://cooperativaemmanuel.it/images/Logo.png" />

    <!-- Geo targeting -->
    <meta name="geo.region" content="IT-72" />
    <meta name="geo.placename" content="Napoli" />
    <meta name="geo.position" content="40.8518;14.2681" />
    <meta name="ICBM" content="40.8518, 14.2681" />
    <!--app-head-->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Preload critical images -->
    <link rel="preload" as="image" href="/images/closeup-support-hands.jpg">
    <link rel="preload" as="image" href="/images/Logo.png">

    <!-- Google Analytics: sostituire G-XXXXXXXXXX con l'ID reale e rimuovere i commenti
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX', { anonymize_ip: true });
    </script>
    -->

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    
    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Emmanuel">
    <link rel="apple-touch-icon" href="/images/Logo.png">

    <!-- Verifica proprietà Google Search Console -->
    <meta name="google-site-verification" content="INSERISCI_QUI_IL_CODICE_GOOGLE" />
    
    <!-- Verifica proprietà Bing Webmaster -->
    <meta name="msvalidate.01" content="INSERISCI_QUI_IL_CODICE_BING" />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
